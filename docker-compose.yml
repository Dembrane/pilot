version: '3'

services:

  dashboard-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api.findcommonground.online
        - VITE_PARTICIPANT_BASE_URL=https://participant.findcommonground.online
        - VITE_USE_PARTICIPANT_ROUTER=0
    restart: unless-stopped
    ports:
      - "5173:5173"
  
  participant-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api.findcommonground.online
        - VITE_PARTICIPANT_BASE_URL=https://participant.findcommonground.online
        - VITE_USE_PARTICIPANT_ROUTER=1
    restart: unless-stopped
    ports:
      - "5174:5173" 

  api-server:
    build: ./server
    restart: unless-stopped
    command: /bin/sh /code/server/prod.sh
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/code/server

  caddy:
    image: caddy:2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config 