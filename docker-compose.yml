x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    labels-regex: "^.+"
  # driver: "journald"
  # options:
  #   tag: "{{.Name}}"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL}
      - PARTICIPANT_BASE_URL=${PARTICIPANT_BASE_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:0.6.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dembrane
      POSTGRES_USER: dembrane
      POSTGRES_PASSWORD: dembrane
    networks:
      - default
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=dembrane
      - RABBITMQ_DEFAULT_PASS=dembrane
    networks:
      - default
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    logging: *default-logging

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /bin/sh /workspace/server/prod.sh
    environment:
      - DATABASE_URL=postgresql+psycopg://dembrane:dembrane@postgres:5432/dembrane
      - RABBITMQ_URL=amqp://dembrane:dembrane@rabbitmq:5672
      - ADMIN_BASE_URL=https://${ADMIN_BASE_URL}
      - PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
      - BUILD_VERSION=${BUILD_VERSION}
    env_file:
      - ./server/.env
    volumes:
      - ./server:/code/server
    networks:
      - default
    depends_on:
      - postgres
      - rabbitmq
    logging: *default-logging

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: /bin/sh /workspace/server/prod-worker.sh
    environment:
      - DATABASE_URL=postgresql+psycopg://dembrane:dembrane@postgres:5432/dembrane
      - RABBITMQ_URL=amqp://dembrane:dembrane@rabbitmq:5672
      - BUILD_VERSION=${BUILD_VERSION}
    env_file:
      - ./server/.env
    volumes:
      - ./server:/code/server
    networks:
      - default
    depends_on:
      - api-server
    logging: *default-logging

  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://${API_BASE_URL}/api
        - VITE_PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
        - VITE_BUILD_VERSION=${BUILD_VERSION}
        - VITE_USE_PARTICIPANT_ROUTER=0
    restart: unless-stopped
    depends_on:
      - api-server
    logging: *default-logging

  participant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://${API_BASE_URL}/api
        - VITE_PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
        - VITE_BUILD_VERSION=${BUILD_VERSION}
        - VITE_USE_PARTICIPANT_ROUTER=1
    restart: unless-stopped
    networks:
      - default
    depends_on:
      - dashboard-frontend
    logging: *default-logging

  # loki:
  #   image: grafana/loki:2.8.0
  #   command: -config.file=/etc/loki/local-config.yaml
  #   volumes:
  #     - ./loki-config.yaml:/etc/loki/local-config.yaml
  #     - loki_data:/loki
  #   ports:
  #     - "3100:3100"
  #   networks:
  #     - default

  # promtail:
  #   image: grafana/promtail:2.8.0
  #   command: -config.file=/etc/promtail/config.yml
  #   volumes:
  #     - ./promtail-config.yml:/etc/promtail/config.yml
  #     - /var/log:/var/log
  #   networks:
  #     - default

  # grafana:
  #   image: grafana/grafana:9.0.0
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #     - GF_SECURITY_ADMIN_USER=admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   depends_on:
  #     - loki
  #   networks:
  #     - default

  promtail:
    container_name: promtail
    image: grafana/promtail:2.8.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-local-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - default

  loki:
    container_name: loki
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - default
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
        EOF
        /run.sh
    ports:
      - "3000:3000"
    networks:
      - default
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:

networks:
  default:
    driver: bridge
