x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

services:
  directus:
    image: directus/directus:10.12.1
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: admin@dembrane.com
      ADMIN_PASSWORD: dembrane
      WEBSOCKETS_ENABLED: true
      MAX_PAYLOAD_SIZE: 100m
      DB_CLIENT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dembrane
      DB_PASS: dembrane

  postgres:
    image: pgvector/pgvector:0.6.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dembrane
      POSTGRES_USER: dembrane
      POSTGRES_PASSWORD: dembrane
    networks:
      - default
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=dembrane
      - RABBITMQ_DEFAULT_PASS=dembrane
    networks:
      - default
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    logging: *default-logging

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /bin/sh /code/server/prod.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 1m
      timeout: 10s
      retries: 3
    environment:
      - DATABASE_URL=postgresql+psycopg://dembrane:dembrane@postgres:5432/dembrane
      - RABBITMQ_URL=amqp://dembrane:dembrane@rabbitmq:5672
      - ADMIN_BASE_URL=https://${ADMIN_BASE_URL}
      - PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
      - BUILD_VERSION=${BUILD_VERSION}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/code/server/uploads
      - ./server/trankit_cache:/code/server/trankit_cache
    networks:
      - default
    depends_on:
      - postgres
      - rabbitmq
    logging: *default-logging

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: /bin/sh /code/server/prod-worker.sh
    environment:
      - DATABASE_URL=postgresql+psycopg://dembrane:dembrane@postgres:5432/dembrane
      - RABBITMQ_URL=amqp://dembrane:dembrane@rabbitmq:5672
      - ADMIN_BASE_URL=https://${ADMIN_BASE_URL}
      - PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
      - BUILD_VERSION=${BUILD_VERSION}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/code/server/uploads
      - ./server/trankit_cache:/code/server/trankit_cache
    networks:
      - default
    depends_on:
      - api-server
    logging: *default-logging

  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://${API_BASE_URL}/api
        - VITE_PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
        - VITE_BUILD_VERSION=${BUILD_VERSION}
        - VITE_USE_PARTICIPANT_ROUTER=0
    restart: unless-stopped
    depends_on:
      - api-server
    logging: *default-logging
    labels:
      - caddy_0.basicauth.0_dembrane=${CADDY_HASHED_PASSWORD}

  participant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://${API_BASE_URL}/api
        - VITE_PARTICIPANT_BASE_URL=https://${PARTICIPANT_BASE_URL}
        - VITE_BUILD_VERSION=${BUILD_VERSION}
        - VITE_USE_PARTICIPANT_ROUTER=1
    restart: unless-stopped
    networks:
      - default
    depends_on:
      - dashboard-frontend
    logging: *default-logging

  promtail:
    image: grafana/promtail:2.8.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - default

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    networks:
      - default
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
        EOF
        /run.sh
    networks:
      - default
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    labels:
      - caddy_0.basicauth.0_dembrane=${CADDY_HASHED_PASSWORD}

volumes:
  loki_data:
  grafana_data:

networks:
  default:
    driver: bridge
