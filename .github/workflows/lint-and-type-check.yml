name: Lint and Type Check

on:
  pull_request:
    branches:
      - main

jobs:
  lint_and_type_check_server:
    name: Lint and Type Check (Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r server/requirements.lock

      - name: Run mypy
        run: |
          mypy . | reviewdog -f=diff -name="mypy" -reporter=github-pr-review -level=warning
        working-directory: server

      - name: Run ruff
        run: |
          ruff . | reviewdog -f=diff -name="ruff" -reporter=github-pr-review -level=warning
        working-directory: server
